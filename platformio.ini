; PlatformIO project config
; https://docs.platformio.org/page/projectconf.html

; TYSW_012_ZK_MAIN_V1.1 round Tuya IR puck: bare TYWE3S module (ESP8266EX).
; esp12e is the closest generic template (same ESP-12 pin-compatible form
; factor); flash size defaults to 1MB below to match the TYWE3S datasheet
; (adjust if `pio run -t upload` reports a flash size mismatch).
[env:tywe3s]
platform = espressif8266
board = esp12e
board_build.flash_size = 1MB
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D MQTT_MAX_PACKET_SIZE=1024
